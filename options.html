<!DOCTYPE html>
<html>
<head>
    <title>LinkIt Options</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            max-width: 400px;
        }
        h1 {
            color: #1a73e8;
            font-size: 24px;
            margin-bottom: 20px;
        }
        label {
            display: flex;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
        }
        input[type="checkbox"] {
            margin-right: 8px;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 16px;
        }
        button:hover {
            background-color: #1557b0;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
            color: #5f6368;
        }
    </style>
</head>
<body>
<h1>LinkIt Options</h1>

<label>
  <input type="checkbox" id="new-tab-toggle">
  Open links in new tab
</label>

<br><br>

<button id="save">Save</button>

<div id="status"></div>

<script src="options.js"></script>
</body>
</html>
